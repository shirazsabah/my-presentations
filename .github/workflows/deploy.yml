name: Deploy Slidev Presentations

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install @antfu/ni
        run: npm install -g @antfu/ni

      - name: Install dependencies
        run: nci

      - name: Build presentations
        run: |
          mkdir -p public
          for dir in talks/*/ ; do
            talk_name=$(basename "$dir")
            echo "🔧 Building $talk_name..."
            cd "$dir"
            nci  # Use nci instead of npm install
            npx slidev build --base "/${{ github.event.repository.name }}/$talk_name/"
            mkdir -p "../../public/$talk_name" # Create the target directory
            cp -r dist/* "../../public/$talk_name/"
            cd ../../
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Root directory of the static site
          path: ./public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire 'public' directory
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
